<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surface Code</title>
<link rel="stylesheet" href="css/theme.css">
<style>
#btn-glitch { color: var(--amber); border-color: #885500; }
canvas { cursor: pointer; }
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="index.html">← MAP</a>
  <div><div class="eyebrow">CHAPTER 5</div><h1>SURFACE CODE</h1></div>
  <div class="levels" id="levels"></div>
</header>

<main class="stage">
  <section class="board">
    <div class="hud">
      <div class="chip"><span id="h-goal-lbl">SOLVED</span> <b id="h-goal">0/0</b></div>
      <div class="chip">LIT <b id="h-lit">0</b></div>
      <div class="chip">HINTS <b id="h-hints">0</b></div>
    </div>
    <canvas id="cv" width="560" height="560"></canvas>
    <div class="controls">
      <button class="btn" id="btn-glitch">⚡ GLITCH</button>
      <button class="btn" id="btn-hint">? HINT</button>
      <button class="btn go" id="btn-check">✓ CHECK</button>
      <button class="btn" id="btn-retry">↺ TRY AGAIN</button>
      <button class="btn" id="btn-reveal">SHOW ANSWER</button>
      <button class="btn next" id="btn-round">NEXT ROUND →</button>
    </div>
    <div class="legend">
      <span><span class="sw" style="background:rgba(255,136,34,.5);border:1px solid #ff8822"></span> Z-check: catches X flips</span>
      <span><span class="sw" style="background:rgba(0,204,255,.4);border:1px solid #00ccff"></span> X-check: catches Z flips</span>
      <span>bright = lit (odd number of flips around it)</span>
      <span>left click = <span class="x">X</span> · right click = <span class="z">Z</span> · both = <span class="y">Y</span> (touch: tap to step Z → X → Y, then wait)</span>
    </div>
    <div class="status info" id="status"></div>
  </section>
  <aside class="bites" id="bites"></aside>
</main>

<script src="js/core/rng.js"></script>
<script src="js/core/pauli.js"></script>
<script src="js/core/codes.js"></script>
<script src="js/core/decoder.js"></script>
<script src="js/ui/progress.js"></script>
<script src="js/ui/canvas.js"></script>
<script src="js/ui/bites.js"></script>
<script src="js/ui/surface.js"></script>
<script>
'use strict';
const P = QEC.Pauli, D = QEC.decoder;
const { glow, noGlow, text, pointer } = QEC.ui;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const W = cv.width;
const rng = QEC.makeRng(QEC.randomSeed());
const bites = new QEC.ui.Bites($('bites'));
bites.logAs = 'ch4';   // storage id of this chapter (see index.html)

const d = 3, code = QEC.codes.rotatedSurfaceCode(d), N = code.n;
const G = QEC.ui.surface.geometry(d, W, 150), { px, py } = G, QR = 22;
const COL = QEC.ui.surface.COL;
const tilePath = s => QEC.ui.surface.tilePath(ctx, code, s, G);
const qubitAt = (r, c) => r * d + c;

// ── Levels ─────────────────────────────────────────────────────────────────
// Both the spot and the error type come from shuffle bags: over four rounds the
// player should meet X, Z and Y, not the same glitch twice in a row by chance.
const single = types => {
  const bagQ = rng.bagInt(N), bagT = rng.bag(types);
  return () => P.on(N, [bagQ()], bagT());
};
// Levels 1–2: one glitch of one type, only on qubits where it lights a pattern of its own.
// The other qubits come in degenerate twins, which level 3 introduces on purpose.
const unique = type => {
  const bagQ = rng.bag(D.uniqueSingles(code, type));
  return () => P.on(N, [bagQ()], type);
};
// Level 3: glitch on one of the two qubits under the top edge's weight-2 X-check, in both rounds.
// Round 2 puts it on the qubit the player picked in round 1, and asks for the other one,
// so the second fix always misses the glitch and still works (the green outline shows why).
const TWIN = [qubitAt(0, 1), qubitAt(0, 2)];

const LEVELS = [
  {
    name: 'Z-CHECKS', goal: 3, tools: ['X'], errors: unique('X'),
    bites: [
      'The square from Chapter 4, grown to a 3 × 3 <b>surface code</b> patch. The 9 circles are data qubits that together store <b>one</b> well-protected qubit.',
      'The tiles sit in a checkerboard, with half-tiles on the edges, so an orange and a cyan tile always share 0 or 2 qubits: no clash. And unlike the square, this patch can <em>fix</em> any single glitch from the lit tiles alone.',
      'The <span class="z">orange tiles</span> are the <b>Z-checks</b>: Chapter 3\'s checkers, now asking two or four qubits. They catch <span class="x">X</span> flips. Warm-up: <b>left-click</b> a qubit to apply <span class="x">X</span>.',
      { t: 'Let an <span class="x">X</span> glitch hit.', wait: 'glitch', hint: 'press ⚡ GLITCH' },
      { t: 'Find the qubit that touches <em>every</em> lit orange tile and <em>no</em> dark orange one. Fix it, then CHECK.', wait: 'solved', hint: 'fix it, then CHECK' },
      'That was round 1 of 3. Solve 2 more. Stuck? <b>? HINT</b> shows what a decoder would do.',
    ],
  },
  {
    name: 'X-CHECKS', goal: 3, tools: ['Z'], errors: unique('Z'),
    bites: [
      'Now the <span class="x">cyan tiles</span>: <b>X-checks</b>, the phase checkers from Chapter 4. They catch <span class="z">Z</span> flips.',
      '<b>Right-click</b> a qubit (on touch: tap it) to apply <span class="z">Z</span>. Fix 3 phase flips.',
    ],
  },
  {
    name: 'TWIN FIX', goal: 2, countAll: true, tools: ['X'], twin: true,
    errors: round => P.on(N, [round > 0 && S.firstPick !== null ? S.firstPick : rng.pick(TWIN)], 'X'),
    candidates: () => TWIN,
    bites: [
      { t: 'A puzzle. Let the glitch hit.', wait: 'glitch', hint: 'press ⚡ GLITCH' },
      { t: 'The two <b style="color:#ffee00">yellow-ringed</b> qubits explain the lit tile <em>equally well</em>. Pick either one, then CHECK.', wait: 'checked', hint: 'pick one, CHECK' },
      { t: 'Same puzzle again. Press NEXT ROUND and let the glitch hit. This time pick the <em>other</em> yellow qubit, the one you did not pick before, then CHECK.', wait: 'checked', hint: 'pick the other one, CHECK' },
      'Both picks worked, but only one of them can be where the glitch was. Look at the <b style="color:#00ff88">green outline</b>: glitch + fix together are exactly the qubits of one <b>check</b>.',
      'Flipping every qubit of a check leaves the stored qubit alone: it is the same as doing nothing. So the two fixes are <b>equally right</b>. This is called <b>degeneracy</b>.',
      'Why it matters: in Chapter 1 every alarm pattern had exactly <b>one</b> right answer. A quantum code can have several. A decoder does not need to find the exact glitch, only <em>one</em> of the right fixes.',
    ],
  },
  {
    name: 'Y = X+Z', goal: 4, tools: ['X', 'Z'], errors: single(['X', 'Z', 'Y']),
    bites: [
      'A <span class="y">Y</span> glitch is an X and a Z flip at once — it lights tiles of <b>both</b> colours.',
      'To fix one, click the same qubit <b>twice</b>: once left (<span class="x">X</span>) and once right (<span class="z">Z</span>), in either order — because Y is just X and Z together. On touch, tap until it shows Y and wait a moment. Fix 4 random glitches.',
    ],
  },
  {
    name: 'OVERLOAD', goal: 3, matchDecoder: true, tools: ['X', 'Z'],
    errors: (() => {
      const bagA = rng.bag(['X', 'Z', 'Y']), bagB = rng.bag(['X', 'Z', 'Y']);
      return () => {
        const [a, b] = rng.sample(N, 2);
        const e = P.on(N, [a], bagA());
        return P.applyAt(e, b, bagB());
      };
    })(),
    bites: [
      'Final level: <b>two</b> glitches per round.',
      'A distance-3 patch only <em>promises</em> to fix one. Sometimes the best first guess is wrong, no matter how clever you are.',
      'So the score is fair: a round counts when your <b>first</b> try does as well as a minimum-weight decoder. Losing a round it would lose too still counts. Score 3.',
    ],
  },
];

// ── State ──────────────────────────────────────────────────────────────────
let S = null, hover = -1, hintUntil = 0, hintCorr = null, explainedTwin = false;   // explainedTwin: degeneracy reminder shown once

function startLevel(i) {
  const lv = LEVELS[i];
  S = { lv, idx: i, solved: 0, played: 0, matched: 0, round: 0, hints: 0, firstPick: null };
  newRound();
  bites.play(lv.bites, () => { if (S.goalReached) levelDone(); else updateUI(); });
}

function newRound() {
  input.cancel();
  S.phase = 'ready';
  S.err = P.identity(N);
  S.corr = P.identity(N);
  S.result = null;
  S.candidates = [];
  S.retried = false;
  S.firstMatch = null;   // OVERLOAD: did the first CHECK of this round do as well as the decoder?
  hintUntil = 0;
  setStatus('All quiet. Press ⚡ GLITCH.', 'info');
  updateUI();
}

const syndrome = () => D.syndrome(code, P.compose(S.err, S.corr));

function glitch() {
  if (S.phase !== 'ready' || !bites.open) return;
  S.err = S.lv.errors(S.round);
  S.candidates = S.lv.candidates ? S.lv.candidates(S.round) : [];
  S.phase = 'hidden';
  setStatus('⚡ Glitch! Read the lit tiles.', 'error');
  bites.notify('glitch');
  updateUI();
}

// Left click applies X, right click Z; clicking both builds Y = X·Z. Levels without a kind of glitch lock that click.
const CLICK = { X: 'left-click (or tap)', Z: 'right-click (or tap)' };
function apply(q, type) {
  if (S.phase !== 'hidden' || !bites.open) return;
  if (!S.lv.tools.includes(type)) {
    const ok = S.lv.tools[0];
    setStatus(`Only ${ok} glitches in this level — ${CLICK[ok]} a qubit to apply ${ok}.`, 'warn');
    return;
  }
  P.applyAt(S.corr, q, type);
  reportLit();
}

// Touch: set q's correction to exactly this letter (picked by tapping through Z → X → Y → none).
function setCorr(q, letter) {
  if (S.phase !== 'hidden' || !bites.open) return;
  P.applyAt(S.corr, q, P.get(S.corr, q));   // clear
  P.applyAt(S.corr, q, letter);
  reportLit();
}

function reportLit() {
  const lit = syndrome().filter(Boolean).length;
  setStatus(lit ? `${lit} tile${lit > 1 ? 's' : ''} still lit.` : 'All tiles dark. Press ✓ CHECK.', lit ? 'info' : 'success');
  updateUI();
}

function hint() {
  input.commit();
  if (S.phase !== 'hidden' || !bites.open) return;
  // what a perfect (minimum-weight) decoder would add on top of your current fixes
  hintCorr = D.lookupDecode(code, syndrome());
  hintUntil = performance.now() + 2500;
  S.hints++;
  setStatus(P.isIdentity(hintCorr) ? 'The decoder would stop here.' : 'Dashed badges: the decoder\'s suggestion.', 'info');
  updateUI();
}

// A logical error means glitch + fix add up to a chain across the patch. Which way it
// runs decides what the player has to add to reach the other, equally consistent fix.
function logicalChain() {
  const r = P.compose(S.err, S.corr);
  const x = !P.commutes(r, code.logicalZ);   // X chain: top ↔ bottom
  const z = !P.commutes(r, code.logicalX);   // Z chain: left ↔ right
  const add = [];
  if (x) add.push('a <span class="x">column of X</span> (top edge to bottom edge)');
  if (z) add.push('a <span class="z">row of Z</span> (left edge to right edge)');
  return {
    flip: x && z ? '<span class="y">Y</span>' : x ? '<span class="x">X</span>' : '<span class="z">Z</span>',
    add: add.join(' and '),
  };
}

// Would the best decoder there is have failed on these same tiles? If so the player had
// no way to read the answer off the board, and saying "try again" alone is just unfair.
function decoderAlsoFails() {
  const syn = D.syndrome(code, S.err);
  return D.residualStatus(code, S.err, D.lookupDecode(code, syn)) === 'logical';
}

function logicalFeedback() {
  const { flip, add } = logicalChain();
  const sneaky = `Glitch + fix together flip the stored qubit (${flip}), and no check can see that. That is why every tile went dark.`;
  if (decoderAlsoFails()) {
    return 'Two glitches are more than this patch promises to fix. These lit tiles also fit <b>another</b> set of glitches, '
      + 'one that needs no more flips. The best bet picks that one, so you and the best decoder both fix the wrong qubits. '
      + `${sneaky} <b>Bad luck, not a mistake${S.lv.matchDecoder ? ': this round counts' : ''}.</b> `
      + `<b>↺ TRY AGAIN</b> and add ${add} to see the other answer, or <b>SHOW ANSWER</b>.`;
  }
  return `${sneaky} Here a fix with <b>fewer flips</b> existed, and fewer flips is the better bet. `
    + (S.lv.matchDecoder ? 'The decoder would have found it, so this round doesn\'t count. ' : '')
    + '<b>↺ TRY AGAIN</b>, then <b>? HINT</b> shows the decoder\'s fix.';
}

function check() {
  input.commit();
  if (S.phase !== 'hidden' || !bites.open) return;
  if (!D.isZero(syndrome())) { setStatus('Some tiles are still lit — keep going.', 'warn'); QEC.ui.fx.nudge(cv); return; }
  // TWIN FIX, round 2: the point is to try the qubit not picked in round 1.
  const pick = P.weight(S.corr) === 1 ? TWIN.find(q => P.get(S.corr, q) === 'X') : undefined;
  if (S.lv.twin && S.round === 1 && S.firstPick !== null && pick === S.firstPick) {
    setStatus('That is the qubit you picked last round. Click or tap it again to undo it, then pick the other yellow one.', 'warn');
    QEC.ui.fx.nudge(cv);
    return;
  }
  if (S.lv.twin && S.round === 0) S.firstPick = pick === undefined ? null : pick;
  S.result = D.residualStatus(code, S.err, S.corr);
  if (S.lv.matchDecoder && S.firstMatch === null) {
    S.firstMatch = S.result === 'ok' || decoderAlsoFails();
    QEC.progress.note('ch4', `overload-${S.round}`, { kind: 'task', ok: S.firstMatch });
  }
  // advance the briefing first, so feedback below lands under the new bite
  bites.notify('checked');
  if (S.result === 'ok') {
    QEC.ui.fx.good(cv);
    bites.notify('solved');
    S.solved++;
    if (S.retried) bites.feedback(S.lv.matchDecoder && S.firstMatch
      ? 'Second try worked. This round counts anyway: the best decoder would have lost it too.'
      : 'Second try worked. A real decoder gets only <b>one</b> guess per round, so it has to pick the most likely fix straight away.'
        + (S.lv.matchDecoder ? ' So this round doesn\'t count.' : ''));
    if (P.equal(S.err, S.corr)) setStatus(`✓ Fixed — exactly the glitched qubit${P.weight(S.err) > 1 ? 's' : ''}.`, 'success');
    else {
      setStatus('✓ Fixed — with a different fix than the glitch! Still perfect.', 'success');
      // TWIN FIX names it in its own bites; elsewhere a reminder, once.
      if (S.lv.twin) {
        if (S.round === 0) bites.feedback('Your fix was not on the glitched qubit, yet it worked. Look at the <b>green outline</b>. Keep playing: the next round shows why.');
      } else if (!explainedTwin) {
        explainedTwin = true;
        bites.feedback('Your fix was not on the glitched qubit, yet it worked. Look at the <b>green outline</b>: glitch + fix together are exactly the qubits of one <b>check</b>, which leaves the stored qubit alone. '
          + (S.idx < 2 ? 'Level 3 is about this.' : 'That is <b>degeneracy</b> again, as in Twin fix.'));
      }
    }
    return endRound();
  }
  // Wrong fix: keep the glitch hidden and let the player try again.
  S.phase = 'failed';
  QEC.ui.fx.bad(cv);
  setStatus('✗ Logical error! The tiles are dark, but the stored qubit got flipped.', 'error');
  bites.feedback(logicalFeedback());
  updateUI();
}

function retry() {
  if (S.phase !== 'failed') return;
  input.cancel();
  S.corr = P.identity(N);
  S.result = null;
  S.retried = true;
  S.phase = 'hidden';
  setStatus('Same glitch, fresh start. Read the tiles again.', 'info');
  updateUI();
}

// The round is over: show where the glitches really were. Counts towards the level.
function endRound() {
  if (S.result === 'logical') bites.feedback('Glitch + fix form a chain from one edge of the patch to the opposite edge (yellow). Such a chain is a <b>logical operator</b>: it flips the stored qubit while every check stays quiet.');
  S.phase = 'revealed';
  S.played++;
  S.round++;
  if (S.lv.matchDecoder && S.firstMatch) S.matched++;
  updateUI();
  const count = S.lv.countAll ? S.played : S.lv.matchDecoder ? S.matched : S.solved;
  // wrap up once the goal is met — but never cut off a bite the player is still reading
  if (count >= S.lv.goal) { S.goalReached = true; if (bites.done) setTimeout(levelDone, 900); }
}

function levelDone() {
  chapter.complete(S.idx);
  const last = chapter.isLast(S.idx);
  bites.finish(last
    ? '✓ <b>Chapter complete.</b> This 3×3 patch is <b>one logical qubit</b>. Bigger patches (distance 5, 7, …) fix more glitches at once — but only if glitches are rare enough. How rare? → Chapter 6.'
    : '✓ <b>Level complete.</b>',
    last
      ? [{ label: 'CHAPTER 6 →', onClick: () => (location.href = 'ch6-threshold.html') }, { label: 'MAP', cls: '', onClick: () => (location.href = 'index.html') }]
      : [{ label: 'NEXT LEVEL →', onClick: () => chapter.go(S.idx + 1) }]);
  S.phase = 'done';
  updateUI();
}

// ── UI ─────────────────────────────────────────────────────────────────────
function setStatus(msg, cls) { $('status').textContent = msg; $('status').className = 'status ' + cls; }

function updateUI() {
  if (!S) return;
  const lv = S.lv;
  $('h-goal-lbl').textContent = lv.countAll ? 'ROUNDS' : lv.matchDecoder ? 'MATCHED' : 'SOLVED';
  $('h-goal').textContent = `${lv.countAll ? S.played : lv.matchDecoder ? S.matched : S.solved}/${lv.goal}`;
  $('h-lit').textContent = S.phase === 'ready' ? 0 : syndrome().filter(Boolean).length;
  $('h-hints').textContent = S.hints;
  const act = bites.open;
  $('btn-glitch').disabled = S.phase !== 'ready' || !act;
  $('btn-hint').disabled = S.phase !== 'hidden' || !act;
  $('btn-check').disabled = S.phase !== 'hidden' || !act;
  $('btn-round').style.display = S.phase === 'revealed' ? '' : 'none';
  $('btn-retry').style.display = $('btn-reveal').style.display = S.phase === 'failed' ? '' : 'none';
}
bites.onChange = updateUI;

$('btn-glitch').onclick = glitch;
$('btn-hint').onclick = hint;
$('btn-check').onclick = check;
$('btn-round').onclick = () => { if (S.phase === 'revealed') newRound(); };
$('btn-retry').onclick = retry;
$('btn-reveal').onclick = () => { if (S.phase === 'failed') endRound(); };

function hitQubit(p) {
  for (let q = 0; q < N; q++) {
    const { r, c } = code.data[q];
    if ((p.x - px(c)) ** 2 + (p.y - py(r)) ** 2 <= (QR + 12) ** 2) return q;
  }
  return -1;
}
const input = QEC.ui.pauliInput(cv, {
  hit: hitQubit, onApply: apply, onSet: setCorr,
  enabled: () => !!S && S.phase === 'hidden' && bites.open,
  allowed: () => S.lv.tools,
  current: q => P.get(S.corr, q),
});
cv.addEventListener('mousemove', e => { hover = hitQubit(pointer(cv, e)); });
cv.addEventListener('mouseleave', () => { hover = -1; });

// ── Drawing ────────────────────────────────────────────────────────────────
function badge(x, y, letter, { dashed = false } = {}) {
  ctx.save();
  ctx.strokeStyle = COL[letter]; ctx.fillStyle = dashed ? 'rgba(0,0,0,0.3)' : 'rgba(0,0,0,0.55)';
  ctx.lineWidth = 2;
  if (dashed) ctx.setLineDash([4, 3]);
  ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  ctx.restore();
  text(ctx, letter, x, y + 1, { font: 'bold 15px Courier New', color: COL[letter] });
}

function draw(t) {
  ctx.clearRect(0, 0, W, W);
  if (!S) return;
  const syn = S.phase === 'ready' ? code.stabs.map(() => 0) : syndrome();
  const revealed = S.phase === 'revealed' || S.phase === 'done';
  const pulse = 0.6 + 0.4 * Math.sin(t * 0.006);
  const residual = P.compose(S.err, S.corr);

  QEC.ui.surface.drawTiles(ctx, code, G, syn, t);

  // degeneracy: highlight a check that equals glitch + fix
  if (revealed && S.result === 'ok' && !P.isIdentity(residual)) {
    code.stabPaulis.forEach((sp, k) => {
      if (!P.equal(sp, residual)) return;
      ctx.save();
      tilePath(code.stabs[k]);
      ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 4; glow(ctx, '#00ff88', 18 * pulse);
      ctx.stroke();
      ctx.restore();
    });
  }

  // logical error: draw the chain through the leftover qubits
  if (revealed && S.result === 'logical') {
    const qs = [];
    for (let q = 0; q < N; q++) if (residual.x[q] || residual.z[q]) qs.push(q);
    ctx.save();
    ctx.strokeStyle = '#ffee00'; ctx.lineWidth = 3; ctx.setLineDash([8, 6]);
    glow(ctx, '#ffee00', 14 * pulse);
    for (const q of qs) {
      const { r, c } = code.data[q];
      ctx.beginPath(); ctx.arc(px(c), py(r), QR + 9, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // qubits
  const showHint = hintCorr && t < hintUntil && S.phase === 'hidden';
  for (let q = 0; q < N; q++) {
    const { r, c } = code.data[q], x = px(c), y = py(r);
    const errHere = revealed && (S.err.x[q] || S.err.z[q]);
    ctx.save();
    ctx.lineWidth = 2.5;
    ctx.fillStyle = '#071022';
    ctx.strokeStyle = errHere ? '#ff4455' : hover === q && S.phase === 'hidden' ? '#ffffff' : '#7fa8c0';
    glow(ctx, ctx.strokeStyle, hover === q ? 16 : 6);
    ctx.beginPath(); ctx.arc(x, y, QR, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();

    if (S.candidates.includes(q) && S.phase === 'hidden') {
      ctx.save();
      ctx.strokeStyle = '#ffee00'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
      glow(ctx, '#ffee00', 10 * pulse);
      ctx.beginPath(); ctx.arc(x, y, QR + 8, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }

    const fix = P.get(S.corr, q), pend = input.pending;
    if (pend && pend.q === q) QEC.ui.drawPending(ctx, x, y, QR, pend, t, COL);
    else if (fix !== 'I') badge(x, y, fix);
    else text(ctx, '?', x, y + 1, { font: 'bold 15px Courier New', color: '#6f93ad' });
    if (showHint && P.get(hintCorr, q) !== 'I') badge(x + 20, y - 20, P.get(hintCorr, q), { dashed: true });
    if (errHere) text(ctx, '⚡' + P.get(S.err, q), x, y + QR + 16, { font: 'bold 14px Courier New', color: '#ff4455' });
  }

  if ((revealed || S.phase === 'failed') && S.result) {
    const ok = S.result === 'ok';
    glow(ctx, ok ? '#00ff88' : '#ff4455', 20);
    text(ctx, ok ? '✓ FIXED' : '✗ LOGICAL ERROR', W / 2, 24, { font: 'bold 22px Courier New', color: ok ? '#00ff88' : '#ff4455' });
    noGlow(ctx);
  }
}

// ── Boot ───────────────────────────────────────────────────────────────────
const chapter = QEC.ui.chapter({ id: 'ch4', el: $('levels'), levels: LEVELS.map(l => l.name), start: startLevel });
