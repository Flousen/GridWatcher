<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glitch Puzzle</title>
<link rel="stylesheet" href="css/theme.css">
<style>
.board { user-select: none; }
canvas { cursor: crosshair; touch-action: none; }
.bite-actions { flex-wrap: wrap; }
.bite-actions .btn { white-space: nowrap; }   /* CHAPTER 2 → and CHALLENGES → side by side */

/* Alarm pattern log: one row per node after TEST */
#log-wrap { margin-top: 12px; width: min(700px, 100%); }   /* hidden until the first TEST */
#log-label { color: #7e92a6; font-size: 0.72em; letter-spacing: 2px; margin: 0 4px 6px; }
#log-entries {
  background: rgba(0,0,0,0.45);
  border: 1px solid rgba(0,255,255,0.08);
  border-radius: 8px;
  padding: 8px 10px;
  max-height: 180px;
  overflow-y: auto;
  min-height: 44px;
  scrollbar-color: #334455 transparent;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.log-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.82em;
  padding: 4px 6px;
  border-radius: 4px;
  animation: slideIn 0.25s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(-8px); }
  to   { opacity: 1; transform: translateX(0); }
}
.log-row .nid  { color: #00aacc; font-weight: bold; min-width: 64px; }
.log-row .pat  { color: #00ffcc; background: rgba(0,200,150,0.08); border: 1px solid rgba(0,200,150,0.25); border-radius: 4px; padding: 2px 10px; font-size: 0.92em; flex: 1; }
.log-row .bits { color: #8fa1b3; letter-spacing: 2px; }
.log-row.empty .pat  { color: #e08080; border-color: rgba(255,80,80,0.25); background: rgba(255,0,0,0.05); }
.log-row.collide .nid { color: #ff4444; }
.log-row.collide .pat { color: #ff6666; border-color: rgba(255,80,80,0.4); background: rgba(255,0,0,0.1); }
</style>
</head>
<body>

<header class="topbar">
  <a class="back" href="index.html">← MAP</a>
  <div><div class="eyebrow">CHAPTER 1 · CLASSICAL WARM-UP</div><h1>GLITCH PUZZLE</h1></div>
  <div class="levels" id="levels"></div>
</header>

<main class="stage">
  <section class="board">
    <div class="hud">
      <div class="chip">NODES <b id="hl-nodes">3</b></div>
      <div class="chip">SENSORS LEFT <b id="hl-budget">2</b></div>
      <div class="chip" id="hl-phase">BUILD</div>
    </div>
    <canvas id="gc" width="700" height="460"></canvas>
    <div class="controls">
      <button class="btn" id="btn-reset">↺ RESET</button>
      <button class="btn go" id="btn-test">▶ TEST</button>
    </div>
    <div class="legend">
      <span>click empty space = <b style="color:var(--purple)">sensor</b></span>
      <span>click a sensor, then nodes = wire / unwire</span>
      <span>right-click / long-press a sensor = remove</span>
    </div>
    <div class="status info" id="status"></div>
    <div id="log-wrap" hidden>
      <div id="log-label">// ALARM PATTERN LOG //</div>
      <div id="log-entries"></div>
    </div>
  </section>
  <aside class="bites" id="bites"></aside>
</main>

<script src="js/core/hamming.js"></script>
<script src="js/ui/progress.js"></script>
<script src="js/ui/canvas.js"></script>
<script src="js/ui/bites.js"></script>
<script>
'use strict';
// ── Canvas setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Colours ───────────────────────────────────────────────────────────────────
const C = {
  nodeFill:    'rgba(0,170,204,0.07)',
  nodeStroke:  '#00aacc',
  nodeBright:  '#00eeff',
  nodeGlow:    '#00ffff',
  nodeGlitch:  '#ff2222',
  nodeGlitchG: '#ff4444',

  sensorFill:  'rgba(140,0,220,0.10)',
  sensorStr:   '#aa00ee',
  sensorBrt:   '#cc44ff',
  sensorGlow:  '#dd00ff',
  sensorSel:   '#ffee00',
  sensorSelG:  '#ffff66',

  connIdle:    '#113355',
  connActive:  '#00ddaa',
  connSuccess: '#00ff88',

  collide:     '#ff3333',
  success:     '#00ff88',
  text:        '#ffffff',
  dimText:     '#445566',
  grid:        'rgba(0,220,255,0.03)',
};

// ── Level data ────────────────────────────────────────────────────────────────
function pts_circle(n, cx, cy, r, startAngle = -Math.PI/2) {
  return Array.from({length: n}, (_, i) => {
    const a = startAngle + i * 2 * Math.PI / n;
    return { x: Math.round(cx + r * Math.cos(a)), y: Math.round(cy + r * Math.sin(a)) };
  });
}

// Bites: what the briefing says, one piece at a time (js/ui/bites.js). Events the game reports:
//   place / select / connect – level 1 controls, step by step
//   valid   – TEST passed: every node rings its own alarm pattern
//   located – the LOCATE step after a valid wiring is done (core levels only)
// `tip` comes up when TEST finds two nodes with the same pattern; `done` closes the level.
// The word "syndrome" appears only after level 1 is solved: experience first, name second.
const skipIf = (evt, already) => () => { if (already()) setTimeout(() => bites.notify(evt), 0); };
// The alarm rings only once this bite is up (level 3 has text bites between TEST and LOCATE).
const LOCATE = { t: 'Now use it. A node glitched and the alarm rang, but the node stays hidden. Click the one that glitched.', wait: 'located', hint: 'click the glitched node',
  onShow: () => startLocate() };

const LEVELS = [
  {
    id: 1,
    title: 'BINARY BASICS',
    sensorBudget: 2,
    bites: [
      'Three <b>data nodes</b>: A, B and C. Any one of them can <b>glitch</b>, and you can\'t see which.',
      { t: 'But you can place <b>sensors</b>. Click an empty spot on the board.', wait: 'place', hint: 'click empty space' },
      { t: 'It glows yellow: the sensor is <b>selected</b>. Click a node to wire it to the sensor.', wait: 'connect', hint: 'click a node' },
      'If that node glitches now, the sensor rings. Your goal: <b>every node rings a different set of sensors</b>. Then the alarm alone tells you which node glitched.',
      { t: 'Place your second sensor. A new sensor is selected right away.', wait: 'place', hint: 'click empty space',
        onShow: skipIf('place', () => S.sensors.length >= 2) },
      { t: 'To rewire an older sensor, click it first so it turns yellow. Try it.', wait: 'select', hint: 'click the other sensor' },
      { t: 'A sensor can watch <b>several</b> nodes; click a wired node again to cut the wire. Wire both sensors, then press <b>TEST</b>: it glitches each node in turn.', wait: 'valid', hint: 'wire, then press TEST' },
      LOCATE,
    ],
    tip: 'Two sensors can ring in three ways: S1 alone, S2 alone, or both. Give each node a different one.',
    done: '✓ <b>Level complete.</b> You found the glitch from the alarm alone. That alarm pattern has a name: the <b>syndrome</b>. It tells you <em>where</em> the glitch is without reading the data. Hold on to it: it is the heart of quantum error correction.',
    nodes: (() => {
      const lab = ['A','B','C'];
      const ps = [{ x:350, y:110 }, { x:200, y:360 }, { x:500, y:360 }];
      return ps.map((p,i) => ({ id:i, ...p, label:lab[i] }));
    })(),
  },
  {
    id: 2,
    title: 'PENTAGON PROTOCOL',
    sensorBudget: 3,
    bites: [
      { t: 'Five nodes, and now <b>three</b> sensors. Two sensors told 3 nodes apart. How many can three sensors tell apart at most?',
        ask: ['4', '6', '7', '8'], answer: 2, kind: 'check', id: 'max-3-sensors',
        reply: (i, ok) => (ok ? '✓ Right: <b>7</b>.' : '✗ Not quite: <b>7</b>.')
          + ' Each sensor rings or stays silent, so there are 2 × 2 × 2 = 8 syndromes. "All silent" points at no node, which leaves 7.' },
      'Write a syndrome as bits, one per sensor: 1 = rings, 0 = silent. Only S1 rings: <b>100</b>. S1 and S3: <b>101</b>. After TEST, the dots under each node show the same bits.',
      { t: 'You need 5 different syndromes, one per node. Wire, then TEST.', wait: 'valid', hint: 'wire, then press TEST' },
      LOCATE,
    ],
    tip: 'Three sensors give 100, 010, 001, 110, 101, 011 and 111. Give each node a different one.',
    done: '✓ <b>Level complete.</b> Many wirings work: any 5 of the 7 syndromes will do.',
    nodes: (() => {
      const lab = ['A','B','C','D','E'];
      return pts_circle(5, 350, 230, 165).map((p,i) => ({ id:i, ...p, label:lab[i] }));
    })(),
  },
  {
    id: 3,
    title: 'HAMMING GRID',
    sensorBudget: 3,
    bites: [
      { t: 'Seven nodes, three sensors, and three sensors make exactly 7 syndromes. So <b>every</b> syndrome must be used, each one once. Wire, then TEST.', wait: 'valid', hint: 'wire, then press TEST' },
      'You just built the <b>Hamming(7,4) code</b> (Richard Hamming, 1950). Three checks find any single glitch among 7 bits. In the real code, 4 of the bits carry data and 3 are extra check bits: hence (7,4).',
      'Hamming\'s own recipe: number the bits 001 to 111 and wire each sensor to the bits with a 1 in its place. Then the syndrome <em>is</em> the number of the broken bit.',
      LOCATE,
    ],
    tip: 'Count in binary: give the nodes 001, 010, 011 … 111 and wire each sensor to the nodes with a 1 in its place.',
    done: '✓ <b>Chapter complete.</b> Three checks pinpoint any single glitch among seven bits. Next: <b>qubits</b>, where glitches come in two kinds. Want more of this puzzle first? The challenges are optional.',
    nodes: (() => {
      const lab = ['A','B','C','D','E','F','G'];
      return pts_circle(7, 350, 228, 170).map((p,i) => ({ id:i, ...p, label:lab[i] }));
    })(),
  },
  {
    id: 4,
    challenge: true,
    title: 'QUAD SIGNAL',
    sensorBudget: 4,
    bites: [
      { t: '<b>Optional challenge.</b> Four sensors make 2⁴ − 1 = <b>15</b> syndromes, now 4 bits long. You need 9 of them. Wire, then TEST.', wait: 'valid', hint: 'wire, then press TEST' },
    ],
    tip: 'Pick any 9 different 4-bit syndromes (not 0000) and give one to each node.',
    done: '✓ <b>Challenge solved.</b>',
    nodes: (() => {
      const lab = 'ABCDEFGHI'.split('');
      return pts_circle(9, 350, 225, 170).map((p, i) => ({ id: i, ...p, label: lab[i] }));
    })(),
  },
  {
    id: 5,
    challenge: true,
    title: 'DENSE MESH',
    sensorBudget: 4,
    bites: [
      { t: '12 nodes and 15 syndromes: only 3 may go unused. Plan before you wire, then TEST.', wait: 'valid', hint: 'wire, then press TEST' },
    ],
    tip: 'Write down 12 of the syndromes 0001 … 1111 first, then wire.',
    done: '✓ <b>Challenge solved.</b>',
    nodes: (() => {
      const lab = 'ABCDEFGHIJKL'.split('');
      const inner = pts_circle(5, 350, 225, 90);
      const outer  = pts_circle(7, 350, 225, 185, -Math.PI / 2 + Math.PI / 7);
      return [...inner, ...outer].map((p, i) => ({ id: i, ...p, label: lab[i] }));
    })(),
  },
  {
    id: 6,
    challenge: true,
    title: 'EXTENDED HAMMING',
    sensorBudget: 4,
    bites: [
      { t: '15 nodes, 4 sensors: <b>every</b> syndrome from 0001 to 1111, each once. Wire, then TEST.', wait: 'valid', hint: 'wire, then press TEST' },
    ],
    tip: 'Number the nodes 0001 to 1111 and wire each sensor to the nodes with a 1 in its place.',
    done: '✓ <b>Every challenge solved.</b> That was the <b>Hamming(15,11) code</b>: 4 checks guard 11 data bits and find any single glitch among all 15.',
    nodes: (() => {
      const lab = 'ABCDEFGHIJKLMNO'.split('');
      const inner = pts_circle(5, 350, 225, 92);
      const outer  = pts_circle(10, 350, 225, 190, -Math.PI / 2 + Math.PI / 10);
      return [...inner, ...outer].map((p, i) => ({ id: i, ...p, label: lab[i] }));
    })(),
  },
];
const CORE_LEVELS = LEVELS.filter(l => !l.challenge).length;

// ── State ─────────────────────────────────────────────────────────────────────
let S = {};
const bites = new QEC.ui.Bites(document.getElementById('bites'));
bites.logAs = 'ch1';

function startLevel(idx) {
  const lv = LEVELS[idx];
  S = {
    lvIdx:    idx,
    phase:    'build',   // 'build' | 'testing' | 'locate' | 'done'
    nodes:    lv.nodes.map(n => ({ ...n })),
    sensors:  [],
    conns:    new Map(), // sensorId → Set<nodeId>
    budget:   lv.sensorBudget,
    maxConn:  QEC.hamming.maxWires(lv.sensorBudget),   // fits every distinct-syndrome wiring
    complete: false,     // all bites through: RESET then replays the level
    selId:    null,      // selected sensor id; ids stay 0..k−1, so S1..Sk are bit positions 1..k
    testAnim: null,      // { nodeId, triggered: [] }
    results:  [],
    collision:null,      // { n1, n2 } or { n1, isolated:true }
    successT: 0,
  };
  setPhaseLabel('BUILD');
  setStatus('', 'info');
  clearLog();
  bites.play(lv.bites, levelComplete);
  updateUI();
  stopLoop();   // also draws the fresh board
}

// RESET clears the wiring; the briefing stays where it is. Once the level is complete it becomes
// REPLAY and restarts the level, so the player can try another wiring.
function resetWiring() {
  if (S.complete) return chapter.go(S.lvIdx);
  if (!canBuild()) return;
  const lv = LEVELS[S.lvIdx];
  Object.assign(S, { phase: 'build', sensors: [], conns: new Map(), budget: lv.sensorBudget, selId: null, results: [], collision: null });
  stopLoop();
  clearLog();
  bites.feedback(null);   // advice about the old wiring no longer applies
  setPhaseLabel('BUILD');
  setStatus('Wiring cleared.', 'info');
  updateUI();
}

// Inputs are live only while a bite waits for the player (or all bites are read), as in every chapter.
// TEST also waits until the briefing asks for it, so the level-1 walkthrough can't be skipped by accident.
const canBuild = () => bites.open && (S.phase === 'build' || (S.phase === 'done' && !!S.collision));
const canTest  = () => canBuild() && (bites.done || bites.waiting === 'valid');

// ── DOM helpers ───────────────────────────────────────────────────────────────
const el = id => document.getElementById(id);

function updateUI() {
  if (!S.nodes) return;
  el('hl-nodes').textContent  = S.nodes.length;
  el('hl-budget').textContent = S.budget;
  el('btn-test').disabled  = !canTest();
  el('btn-reset').disabled = !(canBuild() || S.complete);
  el('btn-reset').textContent = S.complete ? '↺ REPLAY' : '↺ RESET';
  el('btn-reset').title = S.complete ? 'Play this level again' : 'Clear the wiring';
}
// The briefing can lock or unlock the board: redraw so the drag line follows (unless the loop runs).
bites.onChange = () => { updateUI(); if (!rafId && S.nodes) render(); };

function setStatus(msg, cls = 'info') {
  const sb = el('status');
  sb.textContent = msg;
  sb.className = 'status ' + cls;
}

function setPhaseLabel(txt) {
  el('hl-phase').textContent = txt;
}

function clearLog() {
  el('log-entries').innerHTML = '';
  el('log-wrap').hidden = true;
}

// One row per tested node: which sensors rang, and the same as bits (S1 S2 S3 … from the left).
function addLogRow(nodeLabel, triggeredIds, isCollide, isEmpty) {
  const row = document.createElement('div');
  row.className = 'log-row' + (isCollide ? ' collide' : isEmpty ? ' empty' : '');
  row.dataset.lbl = nodeLabel;
  const bits = [...S.sensors].sort((a, b) => a.id - b.id).map(s => (triggeredIds.includes(s.id) ? 1 : 0)).join('');
  const patStr = isEmpty ? '∅ NO SENSOR RINGS' : triggeredIds.map(id => `S${id+1}`).join(' + ');
  row.innerHTML = `<span class="nid">Node ${nodeLabel}</span><span class="pat">${patStr}</span><span class="bits">${bits}</span>`;
  el('log-entries').appendChild(row);
  el('log-wrap').hidden = false;
  el('log-entries').scrollTop = 9999;
}

// ── Drawing helpers ───────────────────────────────────────────────────────────
function glow(col, blur) { ctx.shadowColor = col; ctx.shadowBlur = blur; }
function noGlow()        { ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; }

function drawGrid() {
  ctx.strokeStyle = C.grid;
  ctx.lineWidth = 1;
  const g = 40;
  for (let x = 0; x <= W; x += g) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
  for (let y = 0; y <= H; y += g) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
}

function drawConn(x1, y1, x2, y2, col, glowCol, glowAmt, w = 2) {
  ctx.lineWidth = w;
  ctx.strokeStyle = col;
  ctx.setLineDash([]);
  glow(glowCol, glowAmt);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  noGlow();
}

function drawDashedConn(x1, y1, x2, y2) {
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = C.connActive;
  ctx.setLineDash([8, 5]);
  glow(C.connActive, 8);
  ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  ctx.setLineDash([]);
  noGlow();
}

function drawNode(node, state) {
  // state: 'idle'|'selected'|'glitch'|'collide'|'success'
  const { x, y, label } = node;
  const t = S.successT;

  let strokeCol, fillCol, glowCol, glowAmt, textCol;

  switch (state) {
    case 'glitch':
      strokeCol = C.nodeGlitch; fillCol = 'rgba(255,0,0,0.15)';
      glowCol = C.nodeGlitchG; glowAmt = 28; textCol = '#ff6666';
      break;
    case 'collide':
      strokeCol = C.collide; fillCol = 'rgba(255,0,0,0.12)';
      glowCol = C.collide; glowAmt = 22; textCol = '#ff6666';
      break;
    case 'success': {
      const pulse = 0.6 + 0.4 * Math.sin(t * 0.006 + node.id * 0.7);
      strokeCol = C.success; fillCol = `rgba(0,255,136,${0.06 * pulse})`;
      glowCol = C.success; glowAmt = 18 * pulse; textCol = C.success;
      break;
    }
    default:
      strokeCol = C.nodeStroke; fillCol = C.nodeFill;
      glowCol = C.nodeGlow; glowAmt = 10; textCol = C.text;
  }

  const R = 27;
  ctx.lineWidth = 2;
  ctx.strokeStyle = strokeCol;
  ctx.fillStyle = fillCol;
  glow(glowCol, glowAmt);
  ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // inner ring
  noGlow();
  ctx.strokeStyle = strokeCol + '55';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(x, y, R - 8, 0, Math.PI*2); ctx.stroke();

  // label
  ctx.fillStyle = textCol;
  ctx.font = 'bold 15px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state !== 'idle') glow(glowCol, 12);
  ctx.fillText(label, x, y);
  noGlow();
}

function drawSensor(sensor, state) {
  // state: 'idle'|'selected'|'triggered'|'collide'|'success'
  const { x, y, id } = sensor;
  const label = `S${id+1}`;
  const t = S.successT;

  let strokeCol, fillCol, glowCol, glowAmt, textCol;

  switch (state) {
    case 'selected':
      strokeCol = C.sensorSel; fillCol = 'rgba(255,238,0,0.10)';
      glowCol = C.sensorSelG; glowAmt = 26; textCol = C.sensorSel;
      break;
    case 'triggered':
      strokeCol = C.nodeGlitch; fillCol = 'rgba(255,0,0,0.15)';
      glowCol = '#ff4444'; glowAmt = 28; textCol = '#ff6666';
      break;
    case 'collide':
      strokeCol = C.collide; fillCol = 'rgba(255,0,0,0.12)';
      glowCol = C.collide; glowAmt = 22; textCol = '#ff6666';
      break;
    case 'success': {
      const pulse = 0.5 + 0.5 * Math.sin(t * 0.006 + id * 1.1 + 1.5);
      strokeCol = C.success; fillCol = `rgba(0,255,136,${0.07 * pulse})`;
      glowCol = C.success; glowAmt = 16 * pulse; textCol = C.success;
      break;
    }
    default:
      strokeCol = C.sensorStr; fillCol = C.sensorFill;
      glowCol = C.sensorGlow; glowAmt = 10; textCol = C.sensorBrt;
  }

  const S2 = 20;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.PI / 4);
  ctx.lineWidth = 2;
  ctx.strokeStyle = strokeCol;
  ctx.fillStyle = fillCol;
  glow(glowCol, glowAmt);
  ctx.beginPath(); ctx.rect(-S2, -S2, S2*2, S2*2); ctx.fill(); ctx.stroke();
  noGlow();
  ctx.restore();

  // Sensor label
  ctx.fillStyle = textCol;
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  if (state !== 'idle') glow(glowCol, 10);
  ctx.fillText(label, x, y);
  noGlow();

  // Connection count badge (top-right corner of diamond)
  const connCount = (S.conns.get(id) || new Set()).size;
  const bx = x + 18, by = y - 18;
  ctx.fillStyle = connCount > 0 ? 'rgba(0,220,170,0.18)' : 'rgba(255,255,255,0.06)';
  ctx.strokeStyle = connCount > 0 ? '#00ddaa' : '#334455';
  ctx.lineWidth = 1;
  glow(connCount > 0 ? '#00ddaa' : 'transparent', connCount > 0 ? 8 : 0);
  ctx.beginPath(); ctx.arc(bx, by, 9, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  noGlow();
  ctx.fillStyle = connCount > 0 ? '#00ffcc' : '#445566';
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(connCount, bx, by);
}

// ── Visual feedback helpers ───────────────────────────────────────────────────
function drawPatternDots(node, triggeredIds, sortedSensors) {
  const triggered = new Set(triggeredIds);
  const n = sortedSensors.length;
  if (n === 0) return;
  const dotR = 4, spacing = 12;
  const startX = node.x - ((n - 1) * spacing) / 2;
  const baseY = node.y + 36;
  const isSucc = S.phase === 'done' && !S.collision;

  for (let i = 0; i < n; i++) {
    const active = triggered.has(sortedSensors[i].id);
    ctx.beginPath();
    ctx.arc(startX + i * spacing, baseY, dotR, 0, Math.PI * 2);
    if (active) {
      ctx.fillStyle   = isSucc ? '#00ff88' : '#cc44ff';
      ctx.strokeStyle = isSucc ? '#00ffaa' : '#ee66ff';
      glow(isSucc ? '#00ff88' : '#dd00ff', 8);
    } else {
      ctx.fillStyle   = 'rgba(20,0,30,0.5)';
      ctx.strokeStyle = '#443355';
    }
    ctx.lineWidth = 1;
    ctx.fill(); ctx.stroke();
    noGlow();
  }
}

function drawCollisionArc(na, nb) {
  const t = S.successT;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.004);
  const mx = (na.x + nb.x) / 2, my = (na.y + nb.y) / 2;
  const dx = nb.x - na.x, dy = nb.y - na.y;
  const len = Math.sqrt(dx*dx + dy*dy) || 1;
  const bulge = Math.min(70, len * 0.45);
  const cpx = mx + (-dy / len) * bulge, cpy = my + (dx / len) * bulge;

  ctx.beginPath();
  ctx.moveTo(na.x, na.y);
  ctx.quadraticCurveTo(cpx, cpy, nb.x, nb.y);
  ctx.strokeStyle = `rgba(255,60,60,${0.35 + 0.3 * pulse})`;
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 4]);
  glow('#ff3333', 10 * pulse);
  ctx.stroke();
  ctx.setLineDash([]);
  noGlow();

  // "=" badge at arc midpoint
  const bx = 0.25*na.x + 0.5*cpx + 0.25*nb.x;
  const by = 0.25*na.y + 0.5*cpy + 0.25*nb.y;
  ctx.beginPath();
  ctx.arc(bx, by, 11, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,0,0,0.18)`;
  ctx.strokeStyle = `rgba(255,60,60,${0.5 + 0.4 * pulse})`;
  ctx.lineWidth = 1.5;
  glow('#ff3333', 8 * pulse);
  ctx.fill(); ctx.stroke();
  noGlow();
  ctx.fillStyle = `rgba(255,120,120,${0.8 + 0.2 * pulse})`;
  ctx.font = 'bold 13px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('=', bx, by);
}

function drawIsolatedWarning(node) {
  const t = S.successT;
  const pulse = 0.5 + 0.5 * Math.sin(t * 0.005);
  const wx = node.x, wy = node.y < 70 ? node.y + 46 : node.y - 46;
  ctx.beginPath();
  ctx.arc(wx, wy, 12, 0, Math.PI * 2);
  ctx.fillStyle = `rgba(255,140,0,${0.12 + 0.08 * pulse})`;
  ctx.strokeStyle = `rgba(255,160,0,${0.6 + 0.3 * pulse})`;
  ctx.lineWidth = 1.5;
  glow('#ffaa00', 14 * pulse);
  ctx.fill(); ctx.stroke();
  noGlow();
  ctx.fillStyle = `rgba(255,200,50,${0.8 + 0.2 * pulse})`;
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('!', wx, wy);
}

// ── Main render ───────────────────────────────────────────────────────────────
let mouseXY = null;

function render(ts = 0) {
  ctx.clearRect(0, 0, W, H);
  drawGrid();

  const { phase, nodes, sensors, conns, selId, testAnim, collision, results } = S;
  const isTest    = phase === 'testing';
  const isDone    = phase === 'done';
  const isSuccess = isDone && !collision;

  // ── Which sensors are triggered right now (during test anim) ──
  const triggeredSet = new Set();
  const glitchNodeId = isTest && testAnim ? testAnim.nodeId : -1;
  if (glitchNodeId >= 0) {
    for (const [sid, cs] of conns) {
      if (cs.has(glitchNodeId)) triggeredSet.add(sid);
    }
  }
  // LOCATE: the alarm rings, but the glitched node stays hidden — the player reads it off the sensors.
  const loc = phase === 'locate' ? S.locate : null;
  if (loc) for (const [sid, cs] of conns) if (cs.has(loc.target)) triggeredSet.add(sid);

  // ── Collision sets ──
  const collideNodeIds = new Set();
  const collideSensorIds = new Set();
  if (isDone && collision) {
    if (collision.n1 >= 0) collideNodeIds.add(collision.n1);
    if (!collision.isolated && collision.n2 >= 0) collideNodeIds.add(collision.n2);
    // Mark sensors connected to colliding nodes
    for (const nid of collideNodeIds) {
      for (const [sid, cs] of conns) {
        if (cs.has(nid)) collideSensorIds.add(sid);
      }
    }
  }

  // ── Draw connections ──
  for (const sensor of sensors) {
    const cs = conns.get(sensor.id) || new Set();
    const sTriggered = triggeredSet.has(sensor.id);
    const sCollide   = collideSensorIds.has(sensor.id);

    for (const nid of cs) {
      const node = nodes[nid];
      const nGlitch  = glitchNodeId === nid;
      const nCollide = collideNodeIds.has(nid);
      const active   = sTriggered && (nGlitch || glitchNodeId < 0);

      let col, gc, ga, w;
      if (isDone && collision && (sCollide || nCollide)) {
        col = C.collide + '88'; gc = C.collide; ga = 12; w = 2;
      } else if (isSuccess) {
        const pulse = 0.4 + 0.4 * Math.sin(S.successT * 0.005 + sensor.id * 0.9);
        col = C.connSuccess + 'aa'; gc = C.connSuccess; ga = 10 * pulse; w = 2;
      } else if (active) {
        col = C.connActive; gc = C.connActive; ga = 14; w = 2.5;
      } else {
        col = C.connIdle; gc = 'transparent'; ga = 0; w = 1.5;
      }
      drawConn(sensor.x, sensor.y, node.x, node.y, col, gc, ga, w);
    }
  }

  // ── Hover drag line ──
  if (phase === 'build' && selId !== null && mouseXY && canBuild()) {
    const sel = sensors.find(s => s.id === selId);
    if (sel) drawDashedConn(sel.x, sel.y, mouseXY.x, mouseXY.y);
  }

  // ── Draw nodes ──
  for (const node of nodes) {
    let ns;
    if (glitchNodeId === node.id)         ns = 'glitch';
    else if (loc && loc.flash === node.id) ns = 'success';
    else if (loc && loc.wrong === node.id) ns = 'collide';
    else if (collideNodeIds.has(node.id)) ns = 'collide';
    else if (isSuccess)                   ns = 'success';
    else                                  ns = 'idle';
    drawNode(node, ns);
  }

  // ── Pattern dots: show which sensors fired per node ──
  if (isTest || isDone) {
    const sortedSensors = [...sensors].sort((a, b) => a.id - b.id);
    for (const result of S.results) {
      drawPatternDots(nodes[result.nodeId], result.triggered, sortedSensors);
    }
  }

  // ── Draw sensors ──
  for (const sensor of sensors) {
    let ss;
    if (triggeredSet.has(sensor.id))       ss = 'triggered';
    else if (collideSensorIds.has(sensor.id)) ss = 'collide';
    else if (isSuccess)                    ss = 'success';
    else if (selId === sensor.id)          ss = 'selected';
    else                                   ss = 'idle';
    drawSensor(sensor, ss);
  }

  // ── Failure indicators ──
  if (isDone && collision) {
    if (collision.isolated) {
      drawIsolatedWarning(nodes[collision.n1]);
    } else {
      drawCollisionArc(nodes[collision.n1], nodes[collision.n2]);
    }
  }

  // ── Alarm banner while locating ──
  if (loc) {
    const fired = [...triggeredSet].sort((a, b) => a - b).map(id => `S${id + 1}`).join(' + ');
    ctx.fillStyle = 'rgba(5,5,16,0.82)';
    ctx.fillRect(0, 4, W, 36);
    ctx.fillStyle = '#ff6666';
    ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    glow('#ff4444', 12);
    ctx.fillText(`ALARM ${loc.got + 1}/${loc.need}:  ${fired}  →  which node?`, W/2, 22);
    noGlow();
  }

  // ── Success overlay text ──
  if (isSuccess) {
    const pulse = 0.7 + 0.3 * Math.sin(S.successT * 0.005);
    ctx.globalAlpha = pulse;
    glow(C.success, 25);
    ctx.fillStyle = C.success;
    ctx.font = 'bold 26px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('✓  ALL PATTERNS UNIQUE', W/2, H/2);
    noGlow();
    ctx.globalAlpha = 1;
  }
}

// ── Animation loop ────────────────────────────────────────────────────────────
let rafId = null;
function startLoop() {
  if (rafId) return;
  function loop(ts) {
    S.successT = ts;
    render(ts);
    rafId = requestAnimationFrame(loop);
  }
  rafId = requestAnimationFrame(loop);
}

function stopLoop() {
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  render();
}

// ── Hit testing ───────────────────────────────────────────────────────────────
const HIT = 34;
function hitNode(x, y) {
  for (const n of S.nodes) {
    if ((n.x-x)**2 + (n.y-y)**2 <= HIT**2) return n;
  }
  return null;
}
function hitSensor(x, y) {
  for (const s of S.sensors) {
    if ((s.x-x)**2 + (s.y-y)**2 <= HIT**2) return s;
  }
  return null;
}
function cPos(e) {
  const r = canvas.getBoundingClientRect();
  const sx = W / r.width, sy = H / r.height;
  const src = e.touches ? e.touches[0] : e;
  return { x: (src.clientX - r.left) * sx, y: (src.clientY - r.top) * sy };
}

// ── Input ─────────────────────────────────────────────────────────────────────
canvas.addEventListener('mousemove', e => {
  mouseXY = cPos(e);
  if (S.phase === 'build') render();
});
canvas.addEventListener('mouseleave', () => { mouseXY = null; });

// After a failed test the wiring stays editable: the first change clears the red markers.
function editable() {
  if (S.phase === 'done' && S.collision) {
    S.phase = 'build';
    S.collision = null;
    S.results = [];
    setPhaseLabel('BUILD');
    stopLoop();
  }
  return S.phase === 'build';
}

canvas.addEventListener('click', e => {
  if (S.phase === 'locate') return locateClick(cPos(e));
  if (!canBuild()) {
    // The board is locked while the briefing talks; say so instead of silently ignoring the click.
    if (S.phase === 'build' && !bites.open) {
      const cur = bites.list[bites.i];
      setStatus(cur && cur.ask ? 'Answer the question in the briefing first.' : 'Read the briefing first: press NEXT → there.', 'warn');
    }
    return;
  }
  if (!editable()) return;
  const p = cPos(e);

  const hs = hitSensor(p.x, p.y);
  if (hs) {
    if (S.selId === hs.id) {
      S.selId = null;
      setStatus(`S${hs.id+1} deselected.`, 'info');
    } else {
      S.selId = hs.id;
      setStatus(`S${hs.id+1} selected. Click nodes to wire or unwire them.`, 'info');
      bites.notify('select');
    }
    render(); return;
  }

  const hn = hitNode(p.x, p.y);
  if (hn && S.selId !== null) {
    const sid = S.selId;
    if (!S.conns.has(sid)) S.conns.set(sid, new Set());
    const cs = S.conns.get(sid);
    if (cs.has(hn.id)) {
      cs.delete(hn.id);
      setStatus(`Cut the wire S${sid+1} – Node ${hn.label}.`, 'info');
    } else {
      if (cs.size >= S.maxConn) { setStatus(`At most ${S.maxConn} wires per sensor.`, 'warn'); return; }
      cs.add(hn.id);
      setStatus(`Wired S${sid+1} → Node ${hn.label}.`, 'info');
      bites.notify('connect');
    }
    render(); return;
  }

  if (hn && S.selId === null) {
    setStatus('Select a sensor first (click it), then click this node.', 'warn');
    render(); return;
  }

  // Place new sensor
  if (!hn && S.budget > 0) {
    const ns = { id: S.sensors.length, x: p.x, y: p.y };
    S.sensors.push(ns);
    S.conns.set(ns.id, new Set());
    S.budget--;
    S.selId = ns.id;
    setStatus(`Placed S${ns.id+1}.`, 'info');
    updateUI();
    render();
    bites.notify('place');
    return;
  }

  if (!hn && S.budget === 0 && !hs) {
    setStatus('No sensors left. Right-click (or long-press) a sensor to remove it, or RESET.', 'warn');
  }

  S.selId = null;
  render();
});

// Remove a sensor and renumber the rest, so S1..Sk always match the bit positions 1..k
// (the bits in the log and the dots under each node follow sensor order).
function removeSensor(hs) {
  const conns = new Map(), sel = S.selId, moved = [];
  S.sensors = S.sensors.filter(s => s !== hs).sort((a, b) => a.id - b.id);
  S.selId = null;
  S.sensors.forEach((s, i) => {
    conns.set(i, S.conns.get(s.id));
    if (sel === s.id) S.selId = i;
    if (s.id !== i) moved.push(`S${s.id + 1} is now S${i + 1}`);
    s.id = i;
  });
  S.conns = conns;
  S.budget++;
  updateUI();
  setStatus(`Removed S${hs.id + 1}.` + (moved.length ? ` ${moved.join(', ')}.` : ''), 'info');
  render();
}

canvas.addEventListener('contextmenu', e => {
  e.preventDefault();
  if (!canBuild() || !editable()) return;
  const p = cPos(e);
  const hs = hitSensor(p.x, p.y);
  if (hs) removeSensor(hs);
});

// Touch support: a tap is a click; a long press on a sensor removes it (touch has no right-click).
const LONG_PRESS = 550;
let press = null;   // { x, y, timer, fired }
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const at = { clientX: t.clientX, clientY: t.clientY };
  if (press) clearTimeout(press.timer);
  press = { ...at, fired: false, timer: setTimeout(() => {
    if (!press || !hitSensor(cPos(at).x, cPos(at).y)) return;   // long press on empty space = ordinary tap
    press.fired = true;
    canvas.dispatchEvent(new MouseEvent('contextmenu', { ...at, cancelable: true }));
  }, LONG_PRESS) };
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (!press) return;
  clearTimeout(press.timer);
  if (!press.fired) canvas.dispatchEvent(new MouseEvent('click', { clientX: press.clientX, clientY: press.clientY }));
  press = null;
}, { passive: false });
canvas.addEventListener('touchcancel', () => { if (press) clearTimeout(press.timer); press = null; });

// ── Test logic ────────────────────────────────────────────────────────────────
function runTest() {
  if (!canTest()) return;
  if (S.sensors.length === 0) {
    setStatus('Place at least one sensor first.', 'error'); return;
  }

  S.phase = 'testing';
  S.results = [];
  S.collision = null;
  S.selId = null;
  stopLoop();
  clearLog();
  updateUI();
  setPhaseLabel('TESTING');
  setStatus('Glitching each node in turn…', 'info');
  render();

  let i = 0;
  const DELAY = 750, run = S;

  function step() {
    if (S !== run) return;   // the player switched level mid-test
    if (i >= S.nodes.length) {
      S.testAnim = null;
      finish();
      return;
    }

    const node = S.nodes[i];
    const result = QEC.hamming.alarmPattern(S.conns, node.id);
    const { triggered } = result;

    S.testAnim = { nodeId: node.id, triggered };
    S.results.push(result);

    const isEmpty = triggered.length === 0;
    addLogRow(node.label, triggered, false, isEmpty);
    setStatus(`Glitch on Node ${node.label}…`, 'info');
    render();
    i++;
    setTimeout(step, DELAY);
  }

  setTimeout(step, 300);
}


function finish() {
  setPhaseLabel('DONE');
  S.phase = 'done';
  const lv = LEVELS[S.lvIdx];

  // Detect duplicates / isolated nodes
  const col = QEC.hamming.findCollision(S.results);
  S.collision = col;

  if (col) {
    // Mark collide rows in log
    const rows = el('log-entries').querySelectorAll('.log-row');
    if (col.isolated) {
      const lbl = S.nodes[col.n1].label;
      rows.forEach(r => { if (r.dataset.lbl === lbl) r.classList.add('collide'); });
      setStatus(`✗ Node ${lbl} rings no sensor. Rewire and TEST again.`, 'error');
      bites.feedback(`Node ${lbl} rings no sensor at all, so its glitch would go unnoticed. Wire it to at least one.`);
    } else {
      const l1 = S.nodes[col.n1].label, l2 = S.nodes[col.n2].label;
      rows.forEach(r => { if (r.dataset.lbl === l1 || r.dataset.lbl === l2) r.classList.add('collide'); });
      setStatus(`✗ Nodes ${l1} and ${l2} ring the same sensors. Rewire and TEST again.`, 'error');
      bites.feedback(`If the alarm rings like that, was it ${l1} or ${l2}? No way to tell. ${lv.tip}`);
    }
    QEC.ui.fx.bad(el('gc'));
    startLoop();
  } else {
    QEC.ui.fx.good(el('gc'));
    setStatus('✓ Every node rings its own alarm.', 'success');
    startLoop();   // success pulse until LOCATE (or the level end) takes over
    // Core levels: before moving on, USE the wiring. The LOCATE bite starts it (see LOCATE).
    // Challenges: 'valid' was the last bite, so the level completes.
    bites.notify('valid');
  }
  updateUI();
}

// ── Locate: decode with your own syndrome table ──────────────────────────────
const sensorList = ids => ids.length ? ids.map(id => `S${id + 1}`).join(' + ') : 'no sensor at all';

function startLocate() {
  if (S.phase !== 'done' || S.collision) return;   // only after a wiring passed TEST
  const order = S.nodes.map(n => n.id);
  for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  S.phase = 'locate';
  S.locate = { order, got: 0, need: 2, target: order[0], wrong: -1, flash: -1, missed: false };
  setPhaseLabel('LOCATE');
  setStatus('✓ Every node rings its own alarm.', 'success');
  startLoop();
}

function locateClick(p) {
  const L = S.locate, hn = hitNode(p.x, p.y);
  if (!hn || L.flash >= 0 || bites.waiting !== 'located') return;
  const first = !L.missed;
  const fired = QEC.hamming.alarmPattern(S.conns, L.target).triggered;
  const right = QEC.hamming.locate(S.conns, S.nodes.map(n => n.id), fired).includes(hn.id);
  if (L.got === 0) QEC.progress.note('ch1', `locate-${LEVELS[S.lvIdx].id}`, { kind: 'task', ok: first && right });
  if (!right) {
    L.missed = true;
    L.wrong = hn.id;
    const pat = QEC.hamming.alarmPattern(S.conns, hn.id).triggered;
    setStatus(`✗ Node ${hn.label} would ring ${sensorList(pat)}. That's not what rang.`, 'error');
    bites.feedback('Look for the node wired to <b>every</b> ringing sensor and to <b>no</b> silent one.');
    QEC.ui.fx.nudge(el('gc'));
    return;
  }
  L.flash = hn.id;
  L.wrong = -1;
  QEC.ui.fx.good(el('gc'));
  bites.feedback(null);
  setStatus(`✓ Node ${hn.label}! Found from the alarm alone, without looking at any node.`, 'success');
  setTimeout(() => {
    if (S.locate !== L) return;   // the player switched level meanwhile
    L.got++;
    L.flash = -1;
    L.missed = false;
    if (L.got >= L.need) {
      S.phase = 'done';
      S.locate = null;
      bites.notify('located');   // last bite of a core level: the level completes
      return;
    }
    L.target = L.order[L.got];
    setStatus('Another alarm. Which node glitched?', 'warn');
  }, 900);
}

// All bites of the level are through: the wiring passed TEST (and, in core levels, LOCATE).
function levelComplete() {
  const i = S.lvIdx, lv = LEVELS[i];
  S.phase = 'done';
  S.complete = true;
  setPhaseLabel('DONE');
  chapter.complete(i);
  const toCh2 = { label: 'CHAPTER 2 →', onClick: () => (location.href = 'ch2-qubit-errors.html') };
  if (i === CORE_LEVELS - 1) {
    // Core chapter done: Chapter 2 is the main road, the challenges are optional and deliberately quiet.
    bites.finish(lv.done, [toCh2, { label: 'CHALLENGES →', cls: '', onClick: () => chapter.go(CORE_LEVELS) }]);
    setStatus('✓ Chapter 1 complete!', 'success');
  } else if (i === LEVELS.length - 1) {
    bites.finish(lv.done, [toCh2, { label: 'MAP', cls: '', onClick: () => (location.href = 'index.html') }]);
    setStatus('✓ Every challenge solved!', 'success');
  } else {
    bites.finish(lv.done, [{ label: lv.challenge ? 'NEXT CHALLENGE →' : 'NEXT LEVEL →', onClick: () => chapter.go(i + 1) }]);
    setStatus(lv.challenge ? '✓ Challenge solved!' : '✓ Level complete!', 'success');
  }
  updateUI();
  startLoop(); // pulsing success animation
}

// ── Buttons ───────────────────────────────────────────────────────────────────
el('btn-test').addEventListener('click', runTest);
el('btn-reset').addEventListener('click', resetWiring);

// ── Boot ──────────────────────────────────────────────────────────────────────
// Levels 4–6 are optional challenges: only the first three make the chapter done (storage id 'ch1').
const chapter = QEC.ui.chapter({ id: 'ch1', el: el('levels'), levels: LEVELS.map(l => l.title), start: startLevel, core: CORE_LEVELS });
chapter.begin();
</script>
</body>
